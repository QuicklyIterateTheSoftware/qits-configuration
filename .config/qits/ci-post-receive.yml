# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# ONE STEP, TWO HALVES since this service grew a client, and the split between them is the whole
# point:
#
#   1. build the client SPA (service/src/main/webui = the qits-spa-configuration submodule) HERE, in
#      the step container, which sits on qits-net and can therefore reach the platform's own npm
#      registry — where @qits/ui-components lives and where nothing else can reach it from;
#   2. build this repo's docker/Dockerfile, whose builder stage packages that already-built bundle
#      and never runs an install.
#
# THE PATTERN'S HOME IS qits-gateway AND qits-workspaces — both carry the same two halves for the
# same reason, and their recipes are where the reasoning is maintained. This one follows them rather
# than re-deriving it; keep them matching.
#
# Publish under the tag that is the whole contract with qits-platform-deployments —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true), which is also why the native build's memory is the daemon's and not this
# container's. A failed push is a failed step is a FAILED run, so the CD announcement (SUCCESS only)
# keeps implying "the image exists".
steps:
  # node-docker-base, the image every image-building pipeline on the platform uses: node, npm and git
  # for half one, the docker CLI for half two.
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push fails, the run reports SUCCESS, and cd is told an image exists that does
      # not. -u is load-bearing too: an unset registry variable must stop the step rather than
      # quietly composing a tag against nothing.
      set -eu

      # --- half one: the client -------------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so the qits-spa-configuration submodule at
      # service/src/main/webui arrives as an empty directory — and the Dockerfile's `test -f` guard
      # stops the image build on exactly that (Quinoa's own `No package.json found in Web UI
      # directory` would stop it a moment later). Initialising it here rather than asking the daemon
      # to clone differently keeps the submodule this repo's business, and the derived URL is what
      # makes the committed relative one resolve against whichever host this run cloned from.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-configuration"
      git -c submodule.qits-spa-configuration.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. npm pins a full
      # resolved URL per package, and the SPA's lockfile is generated on the deployment host, so every
      # entry names an edge address that does not exist in this container. `npm ci` fetches tarballs
      # by that URL and never asks the configured registry for them, so the environment below does not
      # reach them: without this swap the install dies on connection refused. The paths are identical
      # on every address, so replacing the ORIGIN and keeping the path is all it takes, and the
      # integrity hashes are what make that safe — bytes from the other address must still hash the
      # same. The checkout is this step's own; nothing is edited that anyone will read again.
      #
      # THE BYTE PLANE IS TWO SERVICES, WHICH IS WHY THE SWAP READS THE PATH. qits-platform-mirror
      # holds the npmjs pull-through cache; qits-artifacts hosts the @qits scope. No single origin
      # serves both, so the path is what tells them apart: an entry under the hosted registry's own
      # pathname — $QITS_NPM_REGISTRY_URL's — is a @qits tarball and gets the hosted origin, and every
      # other entry gets the proxy's.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either —
      # qits-workspaces' recipe measures that failure in full.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-spa-configuration COMMITS an .npmrc (the edge vhosts, right for
      # a developer on the deployment host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so a
      # `cat > ~/.npmrc` preamble would be written and silently ignored. `npm_config_*` environment
      # outranks both files, so it wins without touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-configuration/browser — the bundle the image build consumes, and the ONE
      # artifact this half exists to produce. Lint and test are qits-spa-configuration's own
      # pipeline's job; repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # --- half two: the image --------------------------------------------------------------------
      # --network host, NOT a custom network: buildkit (the builder format the platform targets — a
      # swarm cannot assume the legacy builder) refuses custom networks on a build. Host networking
      # is buildkit-supported, and the maven registry's host-published address is derived from the
      # same injected env the image tag uses, so no address is stated here. The build needs it
      # because this repo depends on qits-db-core, qits-auth-core and qits-arch-rules.
      #
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN, which is the only place it exists.
      # Unconditional on purpose: a missing env source is NOT an error — measured on buildx v0.36.1,
      # `--secret id=x,env=DOES_NOT_EXIST` builds green and the mounted variable is simply unset —
      # so these lines do nothing at all until a run carries the pair.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-configuration:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of one
      # Dockerfile do run concurrently, main's and environment/<tier>'s.

  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      set -eu
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac
      summary=$(git log -1 --format=%s)
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ branch, summary }),
        }).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
        }).catch((err) => {
          console.error(`release call failed: ${err.message}`);
          process.exit(1);
        });
      ' "$QITS_WORKSPACES_URL/workspaces/api/branches/release?repositoryId=$QITS_CI_REPO_ID" \
        "$QITS_CI_BRANCH" "$summary"
