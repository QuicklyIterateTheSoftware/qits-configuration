# THE QA PIPELINE — this repository's only pipeline besides the release recipe, and it runs for
# RELEASE REQUESTS ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in
# the commit that added this file. The reference template with the full argument is qits-ci's
# docs/ci-event-release-request.yml.
#
# Per-push CI is retired platform-wide: nothing builds a branch, because cd deploys what a RELEASE
# published rather than what a push built. qits-projects keeps, per open release request, a backing
# branch `release/<id>` — an octopus merge of the request's N sources, refolded whenever the set
# changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That branch is
# written by qits-githost's merge primitive, which fires no post-receive and therefore publishes no
# `SCMPublishCommit`: without this event the fold exists and nothing builds it.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head, always; only the run's branch and sha come from the payload. So a
# release request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, AND EVERY STEP GATES. "A red verify must not cost the image" used to be
# bought with `gating: false` on the story half. That flag is gone, and with it the idea that some
# failures here are cheaper than others: a red story run holds the fold exactly as a red build does.
#
# It was retired because it could not do the job it existed for. A run's announced verdict is the
# AND of the file's flag and the FAILING step's, so a non-gating step going red ERASED the fact that
# the gating half had passed — qits-projects was never told a gating build was green, and the
# release request waited for a verdict nobody would ever publish. Measured 2026-09-06: a port-bind
# flake in one story stalled a request for fourteen hours, where a plain red settles it in seconds.
#
# Ordering still matters. Keep the stories LAST: everything after a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE. The old build step ended in `docker push
# $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-configuration:$QITS_CI_SHA`, the per-push coordinate cd
# keyed on. A fold's merged sha is not a coordinate anything could deploy. The image is still BUILT
# here — this Dockerfile is a GraalVM native build and a fold that does not compile must not reach a
# release — but nothing is published: the build is the gate and its output is thrown away. The CalVer
# coordinate belongs to ci-event-release.yml, which this rollout also had to WRITE: this repository
# had no release recipe at all, and therefore no way to publish the versioned image the new
# deployment flow asks for.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. Publish-if-absent: events redeliver
# and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since the identity
  # cutover, so a name match on repoId is not dependable. The event echoes the public name; a rename
  # updates this line in the same campaign. `suppressCi` went with the push event that carried it —
  # a release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-configuration-platform-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed
      # and the run reports SUCCESS — a green verdict for a fold that does not build is exactly what
      # the release gate must never be told. -u is load-bearing too: an unset injected address must
      # stop the step rather than quietly building against nothing.
      set -eu

      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # --- half one: the client -------------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so the qits-configuration-platform-frontend submodule at
      # service/src/main/webui arrives as an empty directory — and the Dockerfile's `test -f` guard
      # stops the image build on exactly that (Quinoa's own `No package.json found in Web UI
      # directory` would stop it a moment later). Initialising it here rather than asking the daemon
      # to clone differently keeps the submodule this repo's business, and the derived URL is what
      # makes the committed relative one resolve against whichever host this run cloned from.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-configuration-platform-frontend"
      git -c submodule.qits-configuration-platform-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. npm pins a full
      # resolved URL per package, and the SPA's lockfile is generated on the deployment host, so every
      # entry names an edge address that does not exist in this container. `npm ci` fetches tarballs
      # by that URL and never asks the configured registry for them, so the environment below does not
      # reach them: without this swap the install dies on connection refused. The paths are identical
      # on every address, so replacing the ORIGIN and keeping the path is all it takes, and the
      # integrity hashes are what make that safe — bytes from the other address must still hash the
      # same. The checkout is this step's own; nothing is edited that anyone will read again.
      #
      # THE BYTE PLANE IS TWO SERVICES, WHICH IS WHY THE SWAP READS THE PATH. qits-platform-mirror
      # holds the npmjs pull-through cache; qits-artifacts hosts the @qits scope. No single origin
      # serves both, so the path is what tells them apart: an entry under the hosted registry's own
      # pathname — $QITS_NPM_REGISTRY_URL's — is a @qits tarball and gets the hosted origin, and every
      # other entry gets the proxy's.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either —
      # qits-workspaces' recipe measures that failure in full.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-configuration-platform-frontend COMMITS an .npmrc (the edge vhosts, right for
      # a developer on the deployment host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so a
      # `cat > ~/.npmrc` preamble would be written and silently ignored. `npm_config_*` environment
      # outranks both files, so it wins without touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-configuration/browser — the bundle the image build consumes, and the ONE
      # artifact this half exists to produce. Lint and test are qits-configuration-platform-frontend's own
      # pipeline's job; repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # --- half two: the image --------------------------------------------------------------------
      # THE IMAGE IS BUILT ON THE PLATFORM'S OWN BUILDKITD, NOT ON THE HOST DOCKER DAEMON.
      # `build: true` is what says so: it is the per-step, diff-visible declaration that gets this
      # step the builder's address and the run's commissioned credential, and — unlike the
      # `docker: true` it replaces — it gets no docker socket, because nothing below wants one.
      # qits-buildkit-plan.md in the wrapper is the whole migration; qits-workspace-daemon's
      # .config/qits/ci-event-*.yml are the converted reference pair and carry the long argument.
      #
      # The builder is demanded LOUDLY before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false spells
      # off as empty-never-absent). Either way this step must stop here, naming the cause, rather than
      # run on to a buildctl call that would fail with something about a missing address.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"

      # THE CREDENTIAL IS A SECRET IN FILE FORM ON BOTH SIDES, and never a build arg — an arg is
      # recorded in the image history. Written under umask 077 into /tmp, which is outside the clone,
      # so neither file can enter the build context; buildctl takes them as `src=` and the
      # Dockerfile's mvnw RUN mounts them as bare files under /run/secrets and reads them itself. The
      # `env=` mount form both sides used to use is gone: it needs a dockerfile frontend the BUILDER
      # picks, so a recipe using it is coupled to the builder's version.
      #
      # The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET. `${…:-}` keeps the old
      # property that a run carrying no pair is NOT an error — it wrote empty secrets before, it
      # writes empty files now — which `set -u` would otherwise turn into a failed step.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret

      # NO --network host, AND NOTHING REPLACES IT. Every `RUN` executes in the builder's own network
      # namespace on qits-net, so the two addresses this build dials are the IN-NETWORK ones:
      # $QITS_MAVEN_REGISTRY_URL for the platform's own Maven repository (the build needs it because
      # this repo depends on qits-db-core, qits-auth-core and qits-arch-rules) and
      # $QITS_MAVEN_PROXY_URL for the Central pull-through. The host-published and edge spellings the
      # old --network host reached — `http://$QITS_REGISTRY/…` and $QITS_MAVEN_CENTRAL_MIRROR_URL —
      # do not resolve from there, by design. The Dockerfile's FROM lines keep their committed
      # edge-vhost spellings: the builder's own registry config rewrites those to the platform
      # aliases (qits-containers' buildkitd.toml carries the mapping).
      #
      # NOTHING IS PUBLISHED, SO THERE IS NO `--output` AT ALL. The build is the gate and its result
      # is thrown away; buildctl solves the whole graph and exports nothing, which is exactly what
      # the local `-t qits-configuration:$QITS_CI_SHA` tag stood for — `docker build` simply insists
      # on naming a result. There is no local image store in the path any more, which also retires
      # the old rmi note: two concurrent builds of this Dockerfile now share the builder's
      # content-addressed, refcounted cache, and neither can drop the other's content.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  # --- the stories half: verify, and publish what the run observed --------------------------------
  # ci-event-userflows.yml's step, which is the whole of what that separate file was.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through the story ITs
  # named below — and the reports published as one docs bundle, site @userflows/qits-configuration,
  # version = the merged sha, branch riding as artifacts metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # the gating step above cannot hand this one anything: the verify and the publish stay together.
  #
  # `user: build`, and NOT a switch inside the script: the suite starts zonky's embedded postgres,
  # initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
  # user — maven-base carries one (uid 1001). The step containers are Alpine, which is why BOTH poms
  # that name zonky architectures (configuration, service) carry the -alpine binaries as a fourth
  # arch. qits-eventstream's pipeline is the measured precedent for all of it.
  #
  # Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
  # ignored and npm still runs): the client is the gating step's business, where the
  # qits-configuration-platform-frontend submodule is initialised and its lockfile origins are swapped, and none of
  # that ritual belongs here — the story asserts nothing about the SPA. It is also what keeps this
  # step from needing the submodule at all: the daemon's clone does not recurse, so
  # service/src/main/webui arrives empty and Quinoa would fail the build on exactly that. The packaged
  # fast-jar failsafe boots is otherwise exactly what ships.
  #
  # THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
  # module back into ITs the way qits-githost does. `skipITs` is true in the root pom;
  # PackagedSurfaceIT is the module's other integration test, and while it needs no docker, half of it
  # is about the CLIENT — the base href, the deep links, the fallback that must not swallow a machine
  # path — which the line above deliberately does not build. Flipping the property would make this
  # quinoa-less run red on a test that is right, and `-Dit.test=*IT` would pull it back in. Naming the
  # classes keeps the opt-in to this pipeline and to these stories.
  #
  # THE LIST IS NOT DERIVED AND HAS TO BE MAINTAINED. `-Dit.test` takes commas, and a story class that
  # is not on it is written and never run. Every class shares ONE @TestProfile
  # (TokenValidationBootstrapIT.PackagedWithMockIdp), so the whole list is one launched process, one
  # embedded postgres and one stub event log rather than one per class. The order below is the order
  # they run in anyway (failsafe orders by FQCN within a profile group) and it is load-bearing: the
  # boot IT owns the startup JWKS traffic. See AGENTS.md § Userflows.
  #
  # `-Dtest=SKIPNONE -Dsurefire.failIfNoSpecifiedTests=false` keeps the unit suites out of this run:
  # the gating step's image build compiles and packages this repository, this half is about the
  # stories, and running the unit suites twice per fold buys nothing.
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -Dtest=SKIPNONE -Dsurefire.failIfNoSpecifiedTests=false \
        -DskipITs=false \
        "-Dit.test=TokenValidationBootstrapIT,ConfigurationImportIT,DeploymentConfigurationIT,OperatorEditIT,AccessRefusalIT,ImageReleasePinIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-configuration" \
        "$QITS_DOCS_URL/@userflows/qits-configuration/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-configuration@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-configuration@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
