# Configuration-context defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored entirely — read by whichever app pulls the jar in, here the
# `service` module. Its own src/main/resources/application.properties sits at 250, `.env` at 295 and
# real environment variables at 300, so a deployment overrides any of these without a rebuild.
#
# This context owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing another service's database or its migration history.
#
# WHERE THE DATABASE COMES FROM. `.config/qits/deployments.yml` carries `resources: postgresql:db`;
# qits-platform-deployments creates the role and the database (`qits_configuration`, the default
# derivation from the application name) on the tier's postgres before the successor container
# starts, and injects
#
#     QITS_RESOURCE_DB_URL / QITS_RESOURCE_DB_USERNAME / QITS_RESOURCE_DB_PASSWORD
#
# into it. Those three names are the platform's GENERIC resource contract — nothing about them is
# configuration-specific, which is the point: the application maps them in its own shipped defaults
# and the deployer stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable, rather than opening some fallback store nobody meant. This service is
# credential-adjacent state — it is what a deployment's env is read from — so a silent fall-back to
# somebody else's store would be the worst failure it could have.
quarkus.datasource.configuration.db-kind=postgresql
quarkus.datasource.configuration.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.configuration.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.configuration.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# The driver is the third line of the platform's baseline. PatientPgDriver (qits-db-core) delegates
# to org.postgresql.Driver and, when the database is not there, keeps asking for up to 14s instead
# of failing at once; validate-on-borrow is what turns a dead pooled connection into the fresh
# creation attempt it can be patient about; the 15s acquisition timeout outlasts its deadline, so a
# caller that waits it out gets the database's real refusal rather than a generic pool message.
# `DatasourceBaselineTest` fails the build if a line goes missing.
quarkus.datasource.configuration.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.configuration.jdbc.acquisition-timeout=15S
quarkus.datasource.configuration.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the configuration datasource, owning only this module's
# entities. `packages` assigns entity->PU unambiguously; without it an entity in a service with no
# DEFAULT datasource has no unit to belong to and the boot fails naming neither.
quarkus.hibernate-orm.configuration.datasource=configuration
quarkus.hibernate-orm.configuration.packages=eu.wohlben.qits.configuration.entity

# Own Flyway lineage at a classpath location named after the context, so it can never mix with
# another service's db/migration if the two ever share a jar or a database.
quarkus.flyway.configuration.migrate-at-start=true
quarkus.flyway.configuration.locations=classpath:db/configuration/migration

# THE ENV THIS STORE'S PRE-PLATFORM ROWS BELONG TO, and the one place it is spelled.
#
# V2 makes `env` part of an entry's identity, because this service now runs on the PLATFORM plane and
# holds every environment's configuration in one database. Every row written before that promotion
# was written by an instance that WAS an environment, so all of them belong to exactly one env — but
# a platform service is handed no tier name in-band. Nothing in its own environment says which tier
# the rows it inherited came from, so the operator performing the cutover states it once and the
# migration stamps it into both tables.
#
# IT HAS NO DEFAULT, THE SAME REFUSE-TO-BOOT STANCE AS THE QITS_RESOURCE_DB_* TRIPLE ABOVE. Unset,
# the placeholder expression below is unresolvable and the process dies at Flyway's migrate-at-start
# naming the missing expression. A default would be a guess, and a guess here is not a wrong value in
# one place: it is every historical row of every application stamped with an env nobody chose, in a
# table whose whole purpose is to be answerable about what was set and by whom. A boot that refuses
# is recoverable in one `docker service update`; a backfill that lied is not recoverable at all.
#
# The same property is what the legacy env-less API routes answer with during the transition — see
# control/InstanceEnv — so the backfill and those routes cannot disagree about which env the old
# callers are talking to.
quarkus.flyway.configuration.placeholders.legacy_env=${qits.configuration.legacy-env}
