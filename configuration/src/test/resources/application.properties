# The configuration-domain suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a
# child process by zonky, never a container. Its port is chosen at run time, so the url, username and
# password are not written here at all: EmbeddedPgConfigSource supplies them at an ordinal above this
# file, overriding the QITS_RESOURCE_DB_* expressions this jar ships in
# META-INF/microprofile-config.properties. What is left here is what a file can say.
#
# clean-at-start wipes the schema between Quarkus restarts, which is what keeps a suite that shares
# one database across classes reproducible.
quarkus.datasource.configuration.db-kind=postgresql
quarkus.hibernate-orm.configuration.datasource=configuration
quarkus.hibernate-orm.configuration.packages=eu.wohlben.qits.configuration.entity
quarkus.flyway.configuration.migrate-at-start=true
quarkus.flyway.configuration.clean-at-start=true
quarkus.flyway.configuration.locations=classpath:db/configuration/migration

# NO DEV SERVICES. The first rule here is that a clone tests green with no docker, and a dev service
# is a container start — which is exactly what an unconfigured postgres datasource invites. The
# config source above always gives this one a url, so nothing should ask; this line is what makes
# "should" into "cannot".
quarkus.devservices.enabled=false

# A FREE port, not Quarkus' default 8081 — on the deployment host that is the address the platform's
# own npm registry is published on, and @QuarkusTest restarts race for it anywhere.
quarkus.http.test-port=0
